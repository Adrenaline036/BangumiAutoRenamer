[project]
name = "Bangumi_Auto_Rename"
version = "0.3.0"
description = "Attended media organization with Bangumi and TMDB"
authors = [{ name = "KimigaiiWuyi", email = "444835641@qq.com" }]
dependencies = [
    "tmdbsimple>=2.9.1",
    "jikanpy-v4>=1.0.2",
    "nicegui>=2.9.1",
    "pywin32>=308; sys_platform == 'win32'",
    "structlog>=24.4.0",
    "frozenlist>=1.5.0",
    "xxhash==4.0.1",
]
requires-python = ">=3.11,<4.0"
readme = "README.md"
license = { text = "GPLv3" }


[tool.pdm]
distribution = false

[tool.pdm.scripts]
start = "src.start"

[[tool.pdm.source]]
name = "TUNA"
url = "https://mirrors.tuna.tsinghua.edu.cn/pypi/web/simple"

[tool.isort]
profile = "black"
line_length = 79
length_sort = true
skip_gitignore = true
force_sort_within_sections = true
extra_standard_library = ["typing_extensions"]
